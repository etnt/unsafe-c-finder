[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsafe-c-finder"
version = "0.1.0"
description = "Classify unsafe C/C++ changes with TypeSafe Jev through OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
unsafe-c-finder = "unsafe_c_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unsafe_c_finder"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
